[package]
name = "rustcast-player"
version = "0.0.3"
edition = "2021"
description = "A podcast player built with egui"
license = "GPL-3.0"
repository = "https://github.com/nemanjapetrasinovic/rustcast"
homepage = "https://github.com/nemanjapetrasinovic/rustcast"

[dependencies]
tokio = { version = "1.39.0", features = ["full"] }
egui = "0.30.0"
eframe = "0.30.0"
egui_extras = "0.30.0"
env_logger = "0.11.3"
log = "0.4.22"
ureq = "2.9.7"
url = "2.5.0"
url2audio = "0.2.2"
sea-orm = { version = "^0.12.0", features = [ "sqlx-sqlite", "runtime-async-std-native-tls", "macros" ] }
sea-orm-migration = { version = "^0.12.0", features = [ "sqlx-sqlite", "runtime-async-std-native-tls" ] }
rss = "2.0.8"
egui-timeline-widget = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1
